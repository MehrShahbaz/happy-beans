spring.application.name=happy-beans
server.port=8080

security.jwt.token.secret-key=dummy-secret-key-at-least-32-chars!
security.jwt.token.expire-length=36000

spring.datasource.url=jdbc:h2:mem:test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

stripe.apiKey=STRIPE_SECRET_KEY
stripe.webhookKey=STRIPE_WEBHOOK_KEY

spring.mail.username=World
spring.mail.password=Hello

app.url=http://localhost:8080

logging.level.root=DEBUG
