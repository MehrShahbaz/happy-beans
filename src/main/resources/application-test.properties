app.url=http://localhost:8080
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
# ==========================
# Logging level
# ==========================
logging.level.root=DEBUG
logging.level.techcourse.herobeans=DEBUG

spring.profiles.active=test
spring.application.name=happy-beans
server.port=8080
security.jwt.token.secret-key=dummy-secret-key-at-least-32-chars!
security.jwt.token.expire-length=36000
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
stripe.apiKey=STRIPE_SECRET_KEY
stripe.webhookKey=STRIPE_WEBHOOK_KEY

spring.mail.username=World
spring.mail.password=Hello