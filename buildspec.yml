version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
  pre_build:
    commands:
      - chmod +x gradlew
      - ./gradlew clean
      - echo ">>> Creating .env.properties file..."
      - echo "JWT_SECRET=${JWT_SECRET}" > .env.properties
      - echo "JWT_TIME=${JWT_TIME}" >> .env.properties
      - echo "SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}" >> .env.properties
      - echo "SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}" >> .env.properties
      - echo "SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}" >> .env.properties
      - echo "STRIPE_WEBHOOK_KEY=${STRIPE_WEBHOOK_KEY}" >> .env.properties
      - echo "STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}" >> .env.properties
      - echo "EMAIL_USERNAME=${EMAIL_USERNAME}" >> .env.properties
      - echo "EMAIL_PASSWORD=${EMAIL_PASSWORD}" >> .env.properties
      - echo ".env file created:"

  build:
    commands:
      - echo ">>> Building jar..."
      - ./gradlew bootJar --no-daemon

artifacts:
  files:
    - .env.properties
    - build/libs/*.jar
    - appspec.yml
    - scripts/**/*