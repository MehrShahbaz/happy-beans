# ==========================
# Application-Prod
# ==========================
spring.application.name=happy-beans
server.port=80
app.url=https://www.happy-beans.shop

# ==========================
# JWT Security
# ==========================
security.jwt.token.secret-key=${JWT_SECRET}
security.jwt.token.expire-length=${JWT_TIME}

# ==========================
# Datasource
# ==========================
spring.datasource.url=${DATASOURCE_URL}
#spring.datasource.url=jdbc:postgresql://10.0.100.46:5432/happy_beans
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}

# Hikari settings
spring.datasource.hikari.auto-commit=false

# ==========================
# JPA / Hibernate
# ==========================
## Disable Hibernate automatic DDL; we use schema.sql
spring.jpa.hibernate.ddl-auto=update

# Format SQL for readability
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

# Enable Spring Boot SQL initialization
spring.sql.init.mode=always
spring.sql.init.platform=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# Stripe
# ==========================
stripe.apiKey=${STRIPE_SECRET_KEY}
stripe.webhookKey=${STRIPE_WEBHOOK_KEY}

# ==========================
# Mail
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# ==========================
# Optional config import
# ==========================
spring.config.import=file:/home/ubuntu/app/.env.properties

# ==========================
# Logging level
# ==========================
logging.level.root=INFO
logging.level.techcourse.herobeans=INFO
